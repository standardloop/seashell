---
version: "3"

includes:
  # c: https://raw.githubusercontent.com/standardloop/taskfiles/refs/heads/main/c.yml # can pin in future
  c: ../taskfiles/c.yml

vars:
  CC: clang
  CC_FLAGS: "-Werror -Wextra -Wall -Wfree-nonheap-object -std=c17"
  EXECUTABLE_NAME: seashell
  DYN_LIBS_USED: "-lstandardloop-logger -lstandardloop-util"
  SOURCE_FILES:
    - global.c
    - line.c
    - main.c
    - signals/signals.c
    - terminal/terminal.c
    - cmds/cmds.c
    - cmds/exit.c
    - cmds/help.c
    - cmds/pwd.c
    - cmds/cd.c
    - cmds/ls.c
    - runner/runner.c
    - prompt/prompt.c

tasks:
  default:
    silent: true
    deps:
      - build
      # - build:sanitize
      # - run # we don't want task to process our process

  dependencies:
    desc: "Downloads C program dependencies."
    cmds:
      - task: c:dependencies:logger
      - task: c:dependencies:util

  build:
    deps:
      - dependencies
    cmds:
      - |
        {{.CC}} {{.CC_FLAGS}} \
        {{range .SOURCE_FILES}} {{.}} {{end}} \
        {{.DYN_LIBS_USED_PATH}} \
        {{.DYN_LIBS_USED}} \
        -o {{.EXECUTABLE_NAME}}
    sources:
      - ./**/*.c
    generates:
      - "{{.EXECUTABLE_NAME}}"

  run:
    deps:
      - build
    cmds:
      - ./{{.EXECUTABLE_NAME}}

  sanitize:
    deps:
      - run:sanitize

  build:sanitize:
    run: once
    deps:
      - dependencies
    cmds:
      - |
        {{.CC}} {{.CC_FLAGS}} \
        -fsanitize=address \
        -fno-omit-frame-pointer \
        {{range .SOURCE_FILES}} {{.}} {{end}} \
        {{.DYN_LIBS_USED_PATH}} \
        {{.DYN_LIBS_USED}} \
        -o {{.EXECUTABLE_NAME}}-sanitize
    sources:
      - ./**/*.c
    generates:
      - "{{.EXECUTABLE_NAME}}-sanitize"

  run:sanitize:
    deps:
      - build:sanitize
    cmds:
      - ./{{.EXECUTABLE_NAME}}-sanitize

  clean:
    ignore_error: true
    cmds:
      - rm -f {{.EXECUTABLE_NAME}}
      - rm -f {{.EXECUTABLE_NAME}}-debug
      - rm -f {{.EXECUTABLE_NAME}}-sanitize
      - rm -f {{.EXECUTABLE_NAME}} optimize
      - rm -f a.out

  lab:
    cmds:
      - |
        {{.CC}} {{.CC_FLAGS}} \
        -fsanitize=address \
        -fno-omit-frame-pointer \
        lab.c \
        -o lab
    sources:
      - ./lab.c
    generates:
      - "lab"

  fmt:
    silent: true
    cmds:
      - find . \( -name "*.c" -o -name "*.h" \) -exec clang-format -style=file -i {} +
